<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bouncing Guns Online</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #222; 
            color: white; 
            font-family: sans-serif; 
            overflow: hidden; /* Prevent scrolling on mobile */
            touch-action: none; /* Prevent pull-to-refresh on mobile */
        }
        #gameContainer { 
            position: relative; 
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: center;
        }
        canvas { 
            background-color: #111; 
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2); 
            border: 4px solid #fff; 
            display: block; 
            max-width: 100%; /* Scales canvas for mobile screens */
            height: auto;
        }
        #ui { 
            position: absolute; 
            top: -60px; 
            width: 100%; 
            text-align: center; 
        }
        #menu { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background-color: rgba(17, 17, 17, 0.9); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 10; 
        }
        .arena-btn { 
            background-color: #444; color: white; border: 2px solid #888; 
            padding: 10px 20px; margin: 8px; width: 90%; max-width: 300px; 
            font-size: 16px; cursor: pointer; border-radius: 5px; 
        }
        .arena-btn:hover { background-color: #666; border-color: #fff; }

        /* Mobile Shoot Button */
        #shootBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            z-index: 5;
            user-select: none;
            outline: none;
            display: none; /* Hidden on menu, shown in game */
        }
        #shootBtn:active {
            background-color: rgba(255, 255, 255, 0.5);
        }
        
        /* Show button on smaller screens or when active */
        @media (max-width: 768px) {
            #ui { top: 10px; z-index: 5; text-shadow: 1px 1px 2px black; }
            h2 { margin: 5px 0; font-size: 18px; }
            p { margin: 2px 0; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="ui">
            <h2>Bouncing Guns - ONLINE</h2>
            <p id="roleText" style="color: #aaa;">Connecting to server...</p>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <!-- On-Screen Mobile Shoot Button -->
        <button id="shootBtn">SHOOT</button>

        <div id="menu" style="display: none;">
            <h1 style="font-size: 24px; text-align: center;">Select Playground</h1>
            <p id="waitingText" style="display:none; color: #ffeb3b;">Waiting for Player 1 to select arena...</p>
            <div id="btnContainer" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
                <button class="arena-btn" onclick="requestStart(1)">1. Classic Arena</button>
                <button class="arena-btn" onclick="requestStart(2)">2. Horizontal Movers</button>
                <button class="arena-btn" onclick="requestStart(3)">3. Vertical Movers</button>
                <button class="arena-btn" onclick="requestStart(4)">4. Circular Arena</button>
                <button class="arena-btn" onclick="requestStart(5)">5. Zigzag Pattern</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu');
        const roleText = document.getElementById('roleText');
        const btnContainer = document.getElementById('btnContainer');
        const waitingText = document.getElementById('waitingText');
        const shootBtn = document.getElementById('shootBtn');

        let serverState = {};
        let particles = [];

        socket.on('roleAssigned', (role) => {
            roleText.innerText = `You are: ${role}`;
            if (role === 'Player 1') roleText.style.color = '#ff4444';
            else if (role === 'Player 2') roleText.style.color = '#4444ff';
            
            if (role !== 'Player 1') {
                btnContainer.style.display = 'none';
                waitingText.style.display = 'block';
            }
        });

        // Keyboard support (Desktop)
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') socket.emit('shoot');
        });

        // Touch/Mouse support (Mobile & Desktop)
        function handleShoot(e) {
            e.preventDefault(); // Prevents double-firing and zooming on mobile
            socket.emit('shoot');
        }
        shootBtn.addEventListener('touchstart', handleShoot, { passive: false });
        shootBtn.addEventListener('mousedown', handleShoot);

        function requestStart(arena) {
            socket.emit('startGame', arena);
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                this.radius = Math.random() * 3 + 1; this.life = 1.0; this.decay = Math.random() * 0.05 + 0.02;
            }
            update() { this.x += this.vx; this.y += this.vy; this.life -= this.decay; }
            draw() {
                ctx.globalAlpha = Math.max(this.life, 0); ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        socket.on('playerHit', (data) => {
            for (let i = 0; i < 20; i++) particles.push(new Particle(data.x, data.y, data.color));
        });

        socket.on('stateUpdate', (state) => {
            serverState = state;
            if (state.gameState === 'MENU') {
                menu.style.display = 'flex';
                shootBtn.style.display = 'none'; // Hide button in menu
                particles = []; 
            } else {
                menu.style.display = 'none';
                shootBtn.style.display = 'block'; // Show button when playing
            }
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!serverState.gameState) {
                requestAnimationFrame(draw); return;
            }

            if (serverState.currentArena === 4) {
                ctx.fillStyle = "#222"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.beginPath(); ctx.arc(400, 300, 280, 0, Math.PI * 2);
                ctx.fillStyle = "#111"; ctx.fill(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 4; ctx.stroke(); ctx.closePath();
            } else {
                ctx.fillStyle = '#111'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            ctx.fillStyle = '#333'; ctx.strokeStyle = '#666'; ctx.lineWidth = 2;
            serverState.obstacles.forEach(o => {
                ctx.fillRect(o.x, o.y, o.width, o.height); ctx.strokeRect(o.x, o.y, o.width, o.height);
            });

            particles.forEach(p => { p.update(); p.draw(); });
            particles = particles.filter(p => p.life > 0);

            serverState.bullets.forEach(b => {
                ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = b.color; ctx.fill(); ctx.closePath();
            });

            Object.values(serverState.players).forEach(p => {
                ctx.save(); ctx.translate(p.x, p.y);
                ctx.fillStyle = "white"; ctx.font = "14px Arial"; ctx.textAlign = "center"; ctx.fillText(`Lives: ${p.lives}`, 0, -40);
                ctx.rotate(p.angle); ctx.fillStyle = p.color;
                ctx.fillRect(0, -6, 40, 12); ctx.fillRect(-12, -6, 12, 20);
                ctx.restore();
            });

            if (serverState.gameState === 'GAMEOVER') {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                if (serverState.currentArena === 4) {
                    ctx.beginPath(); ctx.arc(400, 300, 280, 0, Math.PI * 2); ctx.fill();
                } else { ctx.fillRect(0, 0, canvas.width, canvas.height); }
                ctx.fillStyle = "white"; ctx.font = "40px Arial"; ctx.textAlign = "center"; ctx.fillText("GAME OVER", 400, 280);
                ctx.fillStyle = serverState.winnerMessage.includes("Red") ? "#ff4444" : "#4444ff";
                ctx.font = "30px Arial"; ctx.fillText(serverState.winnerMessage, 400, 330);
            }
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
