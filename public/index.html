<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gorilla Throw Online</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #222; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; }
        #gameContainer { position: relative; width: 100%; max-width: 800px; display: flex; flex-direction: column; align-items: center; }
        canvas { background-color: #111; box-shadow: 0 0 20px rgba(255, 255, 255, 0.2); border: 4px solid #fff; display: block; max-width: 100%; height: auto; }
        #ui { position: absolute; top: -60px; width: 100%; text-align: center; }
        #menu { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(17, 17, 17, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        
        /* Avatar Selector Styles */
        .avatar-selector { display: flex; gap: 15px; margin-bottom: 30px; }
        .avatar-img { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #555; cursor: pointer; opacity: 0.6; transition: 0.2s; object-fit: contain; background-color: rgba(255, 255, 255, 0.08); padding: 4px; }
        .avatar-img:hover { opacity: 0.9; }
        .avatar-img.selected { border-color: #ffeb3b; opacity: 1; transform: scale(1.15); box-shadow: 0 0 15px rgba(255, 235, 59, 0.5); }

        .arena-btn { background-color: #444; color: white; border: 2px solid #888; padding: 10px 20px; margin: 8px; width: 90%; max-width: 300px; font-size: 16px; cursor: pointer; border-radius: 5px; }
        .arena-btn:hover { background-color: #666; border-color: #fff; }
        #shootBtn { margin-top: 20px; padding: 15px 50px; border-radius: 30px; background-color: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.5); color: white; font-size: 18px; font-weight: bold; cursor: pointer; z-index: 5; user-select: none; outline: none; display: none; letter-spacing: 2px; transition: all 0.2s ease; }
        #shootBtn:active:not(:disabled) { background-color: rgba(255, 255, 255, 0.5); }
        #shootBtn:disabled { background-color: rgba(255,255,255,0.05); color: #888; border-color: #555; cursor: not-allowed; }
        @media (max-width: 768px) { #ui { top: 10px; z-index: 5; text-shadow: 1px 1px 2px black; } h2 { margin: 5px 0; font-size: 18px; } p { margin: 2px 0; font-size: 12px; } #shootBtn { margin-top: 10px; padding: 10px 40px; font-size: 16px; } .avatar-img { width: 50px; height: 50px; } }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="ui">
            <h2>Gorilla Throw - ONLINE</h2>
            <p id="roleText" style="color: #aaa;">Connecting to server...</p>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <button id="shootBtn">SHOOT</button>
        <div id="menu" style="display: none;">
            
            <h2 style="margin-bottom: 10px;">Choose Your Fighter</h2>
            <div class="avatar-selector">
                <img data-avatar="1000151718.jpg" src="1000151718.jpg" class="avatar-img" onclick="selectAvatar('1000151718.jpg')">
                <img data-avatar="1000151721.jpg" src="1000151721.jpg" class="avatar-img" onclick="selectAvatar('1000151721.jpg')">
                <img data-avatar="1000151724.jpg" src="1000151724.jpg" class="avatar-img selected" onclick="selectAvatar('1000151724.jpg')">
                <img data-avatar="1000151727.jpg" src="1000151727.jpg" class="avatar-img" onclick="selectAvatar('1000151727.jpg')">
            </div>

            <h1 style="font-size: 24px; text-align: center; margin-top: 20px;">Select Playground</h1>
            <p id="waitingText" style="display:none; color: #ffeb3b;">Waiting for Player 1 to select arena...</p>
            <div id="btnContainer" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
                <button class="arena-btn" onclick="requestStart(1)">1. Classic Arena</button>
                <button class="arena-btn" onclick="requestStart(2)">2. Horizontal Movers</button>
                <button class="arena-btn" onclick="requestStart(3)">3. Vertical Movers</button>
                <button class="arena-btn" onclick="requestStart(4)">4. Circular Arena</button>
                <button class="arena-btn" onclick="requestStart(5)">5. Destructible Zigzag</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu');
        const roleText = document.getElementById('roleText');
        const btnContainer = document.getElementById('btnContainer');
        const waitingText = document.getElementById('waitingText');
        const shootBtn = document.getElementById('shootBtn');

        // Strips the grey checkerboard background using a fast border flood-fill
        function removeCheckerboard(img) {
            const size = 128;
            const off = document.createElement('canvas');
            off.width = size;
            off.height = size;
            const octx = off.getContext('2d');

            // Preserve aspect ratio when drawing onto the square offscreen canvas
            const scale = Math.min(size / img.width, size / img.height);
            const dw = img.width * scale;
            const dh = img.height * scale;
            octx.drawImage(img, (size - dw) / 2, (size - dh) / 2, dw, dh);

            const imgData = octx.getImageData(0, 0, size, size);
            const data = imgData.data;
            const visited = new Uint8Array(size * size);
            const queue = new Int32Array(size * size);
            let head = 0, tail = 0;

            function isBg(idx) {
                const i = idx * 4;
                if (data[i + 3] === 0) return true;
                const r = data[i], g = data[i + 1], b = data[i + 2];
                const sat = Math.max(r, g, b) - Math.min(r, g, b);
                const lum = (r + g + b) / 3;
                // Grey checkerboard has low saturation and is darker than the white sticker border
                return sat < 25 && lum < 220;
            }

            // Seed flood-fill from all 4 edges
            for (let x = 0; x < size; x++) {
                const top = x, bot = (size - 1) * size + x;
                if (!visited[top] && isBg(top)) { visited[top] = 1; queue[tail++] = top; }
                if (!visited[bot] && isBg(bot)) { visited[bot] = 1; queue[tail++] = bot; }
            }
            for (let y = 0; y < size; y++) {
                const left = y * size, right = y * size + (size - 1);
                if (!visited[left] && isBg(left)) { visited[left] = 1; queue[tail++] = left; }
                if (!visited[right] && isBg(right)) { visited[right] = 1; queue[tail++] = right; }
            }

            while (head < tail) {
                const idx = queue[head++];
                data[idx * 4 + 3] = 0; // Make transparent

                const x = idx % size;
                const y = (idx / size) | 0;
                if (x > 0 && !visited[idx - 1] && isBg(idx - 1)) { visited[idx - 1] = 1; queue[tail++] = idx - 1; }
                if (x < size - 1 && !visited[idx + 1] && isBg(idx + 1)) { visited[idx + 1] = 1; queue[tail++] = idx + 1; }
                if (y > 0 && !visited[idx - size] && isBg(idx - size)) { visited[idx - size] = 1; queue[tail++] = idx - size; }
                if (y < size - 1 && !visited[idx + size] && isBg(idx + size)) { visited[idx + size] = 1; queue[tail++] = idx + size; }
            }

            octx.putImageData(imgData, 0, 0);
            return off;
        }

        // Preload and process avatar images
        const avatarImages = {};
        // Aligns each avatar's gun barrel with the firing direction (+X)
        const AVATAR_CONFIG = {
            '1000151718.jpg': { flipX: false, rotOffset: 0,    mx: 24, my: 2 },  // Rabbit
            '1000151721.jpg': { flipX: true,  rotOffset: 0.45, mx: 24, my: -6 }, // Panda
            '1000151724.jpg': { flipX: true,  rotOffset: 0.90, mx: 24, my: -4 }, // Monkey
            '1000151727.jpg': { flipX: false, rotOffset: 0,    mx: 25, my: 8 }   // Cat
        };
        ['1000151718.jpg', '1000151721.jpg', '1000151724.jpg', '1000151727.jpg'].forEach(name => {
            const img = new Image();
            img.onload = () => {
                const cleanCanvas = removeCheckerboard(img);
                avatarImages[name] = cleanCanvas;
                // Also update the menu thumbnail to the transparent version
                const thumb = document.querySelector(`img[data-avatar="${name}"]`);
                if (thumb) thumb.src = cleanCanvas.toDataURL('image/png');
            };
            img.src = name;
        });

        let serverState = {};
        let particles = [];
        let currentPing = 0;
        let localLastShot = 0;

        function selectAvatar(imgName) {
            document.querySelectorAll('.avatar-img').forEach(img => img.classList.remove('selected'));
            document.querySelector(`img[data-avatar="${imgName}"]`).classList.add('selected');
            socket.emit('setAvatar', imgName);
        }

        setInterval(() => {
            const start = Date.now();
            socket.emit('ping', () => { currentPing = Date.now() - start; });
        }, 1000);

        socket.on('roleAssigned', (role) => {
            roleText.innerText = `You are: ${role}`;
            if (role === 'Player 1') roleText.style.color = '#ff4444';
            else if (role === 'Player 2') roleText.style.color = '#4444ff';
            if (role !== 'Player 1') { btnContainer.style.display = 'none'; waitingText.style.display = 'block'; }
        });

        function attemptShoot() {
            const now = Date.now();
            if (now - localLastShot < 2000) return; 
            localLastShot = now;
            shootBtn.disabled = true; shootBtn.innerText = "RELOADING...";
            setTimeout(() => { shootBtn.disabled = false; shootBtn.innerText = "SHOOT"; }, 2000);
            socket.emit('shoot');
        }

        window.addEventListener('keydown', (e) => { if (e.code === 'Space') attemptShoot(); });
        function handleShoot(e) { e.preventDefault(); attemptShoot(); }
        shootBtn.addEventListener('touchstart', handleShoot, { passive: false });
        shootBtn.addEventListener('mousedown', handleShoot);
        function requestStart(arena) { socket.emit('startGame', arena); }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                this.radius = Math.random() * 3 + 1; this.life = 1.0; this.decay = Math.random() * 0.05 + 0.02;
            }
            update() { this.x += this.vx; this.y += this.vy; this.life -= this.decay; }
            draw() { ctx.globalAlpha = Math.max(this.life, 0); ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1.0; }
        }

        socket.on('playerHit', (data) => { for (let i = 0; i < 20; i++) particles.push(new Particle(data.x, data.y, data.color)); });
        socket.on('shieldBreak', (data) => { for (let i = 0; i < 15; i++) particles.push(new Particle(data.x, data.y, '#00ffff')); });
        socket.on('teleportEffect', (data) => { 
            for (let i = 0; i < 15; i++) {
                particles.push(new Particle(data.p1.x, data.p1.y, '#9c27b0')); 
                particles.push(new Particle(data.p2.x, data.p2.y, '#9c27b0')); 
            }
        });

        socket.on('stateUpdate', (state) => {
            serverState = state;
            if (state.gameState === 'MENU') { menu.style.display = 'flex'; shootBtn.style.display = 'none'; particles = []; } 
            else { menu.style.display = 'none'; shootBtn.style.display = 'block'; }
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!serverState.gameState) { requestAnimationFrame(draw); return; }

            if (serverState.currentArena === 4) {
                ctx.fillStyle = "#222"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.beginPath(); ctx.arc(400, 300, 280, 0, Math.PI * 2); ctx.fillStyle = "#111"; ctx.fill(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 4; ctx.stroke(); ctx.closePath();
            } else {
                ctx.fillStyle = '#111'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            ctx.textAlign = "left";
            if (currentPing > 150) { ctx.fillStyle = "#ff4444"; ctx.font = "bold 16px Arial"; ctx.fillText(`⚠️ High Ping: ${currentPing}ms`, 15, 30); } 
            else if (currentPing > 0) { ctx.fillStyle = "#44ff44"; ctx.font = "14px Arial"; ctx.fillText(`Ping: ${currentPing}ms`, 15, 30); }

            ctx.lineWidth = 2;
            if (serverState.obstacles) {
                serverState.obstacles.forEach(o => {
                    ctx.globalAlpha = o.health / 3; 
                    ctx.fillStyle = '#333'; ctx.strokeStyle = '#666';
                    ctx.fillRect(o.x, o.y, o.width, o.height); ctx.strokeRect(o.x, o.y, o.width, o.height);
                    ctx.globalAlpha = 1.0;
                });
            }

            if (serverState.powerUps) {
                serverState.powerUps.forEach(pu => {
                    ctx.font = "20px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    if (pu.type === 'shield') ctx.fillText("🛡️", pu.x, pu.y);
                    if (pu.type === 'multishot') ctx.fillText("🍌", pu.x, pu.y);
                    if (pu.type === 'double') ctx.fillText("✌️", pu.x, pu.y);
                    if (pu.type === 'speed') ctx.fillText("⚡", pu.x, pu.y);
                    if (pu.type === 'life') ctx.fillText("❤️", pu.x, pu.y); 
                    if (pu.type === 'swap') ctx.fillText("🔄", pu.x, pu.y); 
                });
            }

            particles.forEach(p => { p.update(); p.draw(); });
            particles = particles.filter(p => p.life > 0);

            if (serverState.bullets) {
                serverState.bullets.forEach(b => {
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fillStyle = "#ffeb3b";
                    ctx.fill();
                    ctx.strokeStyle = "#f57f17";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                });
            }

            if (serverState.players) {
                Object.values(serverState.players).forEach(p => {
                    ctx.save(); ctx.translate(p.x, p.y);
                    
                    // Draw Player Identifier and Health
                    ctx.fillStyle = p.color; ctx.font = "bold 14px Arial"; ctx.textAlign = "center"; 
                    let statusText = `Lives: ${p.lives}`;
                    if (p.multiShotsLeft > 0) statusText += ` (3x)`;
                    if (p.doubleShotsLeft > 0) statusText += ` (2x)`;
                    ctx.fillText(statusText, 0, -45);
                    
                    if (p.hasShield) {
                        ctx.beginPath(); ctx.arc(0, 0, 36, 0, Math.PI * 2);
                        ctx.strokeStyle = "rgba(0, 255, 255, 0.8)"; ctx.lineWidth = 4; ctx.stroke();
                    }

                    ctx.rotate(p.angle); 

                    const cfg = AVATAR_CONFIG[p.avatar] || { flipX: false, rotOffset: 0, mx: 24, my: 0 };

                    // Draw the avatar oriented so its gun points straight along the aim line
                    ctx.save();
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 12;
                    ctx.rotate(cfg.rotOffset);
                    if (cfg.flipX) ctx.scale(-1, 1);

                    if (p.avatar && avatarImages[p.avatar]) {
                        ctx.drawImage(avatarImages[p.avatar], -30, -30, 60, 60);
                    } else {
                        ctx.fillStyle = p.color;
                        ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI * 2); ctx.fill();
                    }
                    ctx.restore();

                    // Faint Aiming Laser Sight extending from the gun barrel
                    const laserLength = 150;
                    const grad = ctx.createLinearGradient(cfg.mx, cfg.my, cfg.mx + laserLength, cfg.my);
                    grad.addColorStop(0, p.color);
                    grad.addColorStop(1, "rgba(255, 255, 255, 0)");

                    ctx.save();
                    ctx.globalAlpha = 0.45;
                    ctx.strokeStyle = grad;
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 4]);

                    let angles = [0];
                    if (p.multiShotsLeft > 0) angles = [-0.3, 0, 0.3];
                    else if (p.doubleShotsLeft > 0) angles = [-0.15, 0.15];

                    angles.forEach(offset => {
                        ctx.beginPath();
                        ctx.moveTo(cfg.mx, cfg.my);
                        ctx.lineTo(
                            cfg.mx + Math.cos(offset) * laserLength,
                            cfg.my + Math.sin(offset) * laserLength
                        );
                        ctx.stroke();
                    });
                    ctx.restore();

                    // Dynamic Muzzle Flash at the exact gun barrel tip
                    if (p.throwTimer > 10) {
                        ctx.beginPath();
                        ctx.arc(cfg.mx, cfg.my, Math.random() * 6 + 6, 0, Math.PI * 2);
                        ctx.fillStyle = "rgba(255, 140, 0, 0.85)"; 
                        ctx.fill();
                        
                        ctx.beginPath();
                        ctx.arc(cfg.mx, cfg.my, Math.random() * 3 + 3, 0, Math.PI * 2);
                        ctx.fillStyle = "rgba(255, 255, 0, 1)"; 
                        ctx.fill();
                    }

                    ctx.restore();
                });
            }

            if (serverState.gameState === 'GAMEOVER') {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                if (serverState.currentArena === 4) { ctx.beginPath(); ctx.arc(400, 300, 280, 0, Math.PI * 2); ctx.fill(); } 
                else { ctx.fillRect(0, 0, canvas.width, canvas.height); }
                ctx.fillStyle = "white"; ctx.font = "40px Arial"; ctx.textAlign = "center"; ctx.fillText("GAME OVER", 400, 280);
                ctx.fillStyle = serverState.winnerMessage.includes("Player 1") ? "#ff4444" : "#4444ff";
                ctx.font = "30px Arial"; ctx.fillText(serverState.winnerMessage, 400, 330);
            }
            requestAnimationFrame(draw);}
        draw();
    </script>
</body>
</html>
